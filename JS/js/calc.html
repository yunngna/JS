<body>
    <h1>계산기</h1>
    <input type="text" id="num1">
    <input type="text" id="num2">
    <button type="button" id="btnCalc">계산</button>
    <div id="result" style="border:1px solid blue; height:50px">
        <!-- 여기에 결과 값이 들어 오기 때문에 innerHTML 로 넣어 줘야 한다. -->
    </div>
    <script>
     
    </script>
</body>
</html>
<!--fuction calc() 만들기-->
<script>
    //계산 버튼 클릭 이벤트
    //두 입력값의 합을 계산해서 div.result 에 출력 
    
    // getElementById, innerHTML (속성이면 .   , 함수면 () )
    /**addEventListener 와 onClick의 차이는 addEventListener는 추가의 개념으로 여러개 이벤트 추가 가능하다. 
    반면 onclick은 하나의 함수만 추가 가능하다. */
    btnCalc.addEventListener("click",calc);
    btnCalc.addEventListener("click",function(){ alert('end')});
    //btnCalc.addEventListener("click", () =>  alert('end')); // 익명함수는 화살표 함수로 사용 가능 하다. 


    function calc(){
        let num1 = document.getElementById("num1").value; // == document.querySelector("#num1").value
        let num2 = document.getElementById("num2").value;

        let result = document.getElementById("result");

        result.innerHTML = Number(num1)+ Number(num2); // 태그의 내용을 변경 하기 때문에 innerHTML
        //parseInt => 해당 경우는 값이 없는 경우 null로 처리 된다. 그래서 주로 width = "20px" 에서 뒤에 px을 때고 숫자만 읽고 싶을때 사용 한다. 
        // number의 경우 값이 없는 경우 0 처리 
    }
    


</script>
